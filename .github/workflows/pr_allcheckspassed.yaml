---
name: allcheckspassed # https://github.com/wechuli/allcheckspassed
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read # required for actions/checkout
concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  allcheckspassed:
    runs-on: ubuntu-latest
    permissions:
      actions: read # required to ignore superseded workflow runs
      checks: read # required to poll checks
      contents: read # required for actions/checkout
    steps:
      # yamllint disable-line rule:line-length
      - uses: wechuli/allcheckspassed@204ff63e89eabdc8086f0c50b91f675bcf37c8f6 # v2.4.0
        with:
          delay: "3" # default: 1
          retries: "20" # default: 10
          polling_interval: "1" # default
          checks_exclude: Graphite / mergeability_check|Rust cache measurement
          ignore_superseded_runs: "true"
