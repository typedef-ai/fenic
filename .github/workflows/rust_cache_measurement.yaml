---
name: Rust cache measurement
on:
  workflow_dispatch:
concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  measure:
    # This distinct check name is excluded from the PR aggregate.
    name: Rust cache measurement ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: setup just
        # yamllint disable-line rule:line-length
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
      - name: setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          prune-cache: false
      - name: setup rust
        # yamllint disable-line rule:line-length
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1
        with:
          toolchain: stable
          cache: false
      - name: cache Rust dependencies
        # yamllint disable-line rule:line-length
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: fenic-rust-v1
          workspaces: |
            rust -> target
      - name: run Rust unit tests
        working-directory: rust
        run: |
          python_libdir=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          export LD_LIBRARY_PATH="$python_libdir:$LD_LIBRARY_PATH"
          cargo test --no-default-features --locked
      - name: sync local locked dependencies
        shell: bash
        run: |
          just sync="true" sync-local
      - name: run local tests with synced dependencies
        shell: bash
        run: |
          just sync=false test-local openai gpt-4.1-nano openai text-embedding-3-small
