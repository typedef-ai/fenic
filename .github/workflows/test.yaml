---
name: test
on:
  pull_request:
    types: [labeled, opened, reopened, synchronize]
    branches-ignore:
      - release-please**
    paths:
      - .github/workflows/pr_allcheckspassed.yaml
      - .github/workflows/test.yaml
      - rust/**
      - src/**
      - tests/**
      - pyproject.toml
      - uv.lock
  merge_group:
    types: [checks_requested]
  schedule:
    # daily at 8am Pacific (15:00 UTC)
    - cron: 0 15 * * *
concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build test matrix
        id: matrix
        # yamllint disable rule:line-length
        run: |
          if [[ "${{ github.event_name }}" == "schedule" || "${{ contains(github.event.pull_request.labels.*.name, 'ci:full-matrix') }}" == "true" ]]; then
            # Full coverage runs on schedule and when a PR opts in.
            matrix='{"dependency": ["true", "min", "max"], "test": ["local", "cloud"], "python-version": ["3.10", "3.11", "3.12", "3.13", "3.14"]}'
          else
            # PR and merge-queue checks cover the supported Python boundaries.
            matrix='{"include": [{"dependency": "true", "test": "local", "python-version": "3.10"}, {"dependency": "true", "test": "local", "python-version": "3.14"}]}'
          fi
          # shellcheck disable=SC2086
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
        # yamllint enable rule:line-length
  test:
    needs: matrix
    # yamllint disable-line rule:line-length
    name: test ${{ matrix.python-version }}, ${{ matrix.test }}, ${{ matrix.dependency }}
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    strategy:
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: select test scope
        # yamllint disable-line rule:line-length
        # GitHub withholds repository secrets from a pull_request run triggered from a
        # fork, so the provider API keys above are empty on those runs. Tests that build
        # a live session still work, because a placeholder key satisfies client
        # construction (see tests/conftest.py); only tests that need a genuine response
        # from the provider are dropped here, via the requires_provider_key marker.
        id: scope
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            echo "is_fork=true" >> "$GITHUB_OUTPUT"
            echo "marker_expr=not cloud and not requires_provider_key" >> "$GITHUB_OUTPUT"
          else
            echo "is_fork=false" >> "$GITHUB_OUTPUT"
            echo "marker_expr=not cloud" >> "$GITHUB_OUTPUT"
          fi
      - name: setup just
        # yamllint disable-line rule:line-length
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
      - name: setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: true
          enable-cache: true
          prune-cache: false
      - name: setup rust
        # yamllint disable-line rule:line-length
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1
        with:
          toolchain: stable
          cache: false
      - name: cache Rust dependencies
        id: rust-cache
        # yamllint disable-line rule:line-length
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Stable across the Python matrix; the action also hashes Cargo manifests and locks.
          shared-key: fenic-rust-v1
          workspaces: |
            rust -> target
      - name: Check if Rust unit tests need to be run
        id: rust_changed
        run: |
          git fetch origin ${{ github.base_ref }}
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            if git diff --quiet origin/${{ github.base_ref }} -- rust/; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            # For scheduled runs, always run tests
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      - name: Run Rust unit tests
        if: steps.rust_changed.outputs.changed == 'true'
        working-directory: rust
        run: |
          export LD_LIBRARY_PATH=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))"):$LD_LIBRARY_PATH
          cargo test --no-default-features --locked
      # yamllint disable-line rule:line-length
      - name: sync ${{ matrix.test }} ${{ matrix.dependency == 'true' && 'locked' || matrix.dependency }} dependencies
        shell: bash
        run: |
          just sync="${{ matrix.dependency }}" sync-${{ matrix.test }}
      # yamllint disable-line rule:line-length
      - name: run ${{ matrix.test }} tests with synced dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.test }}" == "local" ]]; then
            just sync=false test-local openai gpt-4.1-nano openai text-embedding-3-small \
              "${{ steps.scope.outputs.marker_expr }}"
          else
            just sync=false test-${{ matrix.test }} openai gpt-4.1-nano openai text-embedding-3-small
          fi
      - name: report reduced coverage on fork PRs
        if: always() && matrix.test == 'local' && steps.scope.outputs.is_fork == 'true'
        shell: bash
        run: |
          excluded=$(uv run pytest -m "cloud or requires_provider_key" tests --collect-only -q 2>/dev/null | tail -1)
          {
            echo "### Fork PR: reduced test coverage"
            echo
            echo "GitHub does not give a fork PR's run access to this repo's provider API"
            echo "keys, so this run skipped every test that needs a genuine response from"
            echo "an LLM provider. Everything else ran and is a real pass/fail signal."
            echo
            echo "Skipped: \`${excluded}\`"
          } >> "$GITHUB_STEP_SUMMARY"
