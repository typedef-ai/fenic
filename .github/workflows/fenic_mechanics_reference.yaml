---
name: fenic-mechanics reference
# The fenic-mechanics skill reference is generated by introspecting the installed
# fenic (this repo's own source), so it silently drifts when the public API or the
# repo version changes. This workflow keeps it current in two modes:
#   - CHECK (normal PR, or a manual dispatch): regenerate and fail if the committed
#     reference differs, so an API change cannot merge without an updated reference.
#   - FIX (release-please's own PR only): regenerate and push the result onto
#     release-please's branch, so the version-stamp bump
#     (and any API deltas) ride into the release commit + tag through the normal
#     squash-merge. Direct pushes to protected `main` are impossible (signed
#     commits + app not in the push allow-list), so the fix rides the release PR.
on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - src/**
      - rust/**
      - pyproject.toml
      - uv.lock
      - justfile
      - .claude/skills/fenic-mechanics/scripts/generate_reference.py
      - .claude/skills/fenic-mechanics/reference/**
      - .github/workflows/fenic_mechanics_reference.yaml
  # Manual runs are CHECK-only. To (re)apply FIX mode to an already-open release
  # PR, reopen it (or let release-please's next update land) so this re-fires
  # with the release branch as github.head_ref.
  workflow_dispatch:
concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  reference:
    name: reference up to date
    runs-on: ubuntu-latest
    steps:
      # Decide CHECK vs FIX and the branch to push onto. FIX is gated on BOTH the
      # release-please branch prefix AND the release-bot author (defense in depth);
      # everything else (normal PRs, manual dispatch) is CHECK.
      - name: resolve mode
        id: mode
        env:
          head_ref: ${{ github.head_ref }}
          pr_author: ${{ github.event.pull_request.user.login }}
        run: |
          fix=false
          ref=""
          if [ "${pr_author}" = "typedef-ai-gha[bot]" ] && [[ "${head_ref}" == release-please--* ]]; then
            fix=true
            ref="${head_ref}"
          fi
          {
            echo "fix=${fix}"
            echo "ref=${ref}"
          } >> "$GITHUB_OUTPUT"
          echo "resolved mode: fix=${fix} ref=${ref:-<check>}"
      # FIX mode pushes onto a bot-owned branch, which needs the GitHub App token
      # (the default GITHUB_TOKEN push would not re-trigger checks).
      - name: generate app token
        id: app_token
        if: steps.mode.outputs.fix == 'true'
        # yamllint disable-line rule:line-length
        uses: suzuki-shunsuke/github-token-action@350d7506222e3a0016491abe85b5c4dd475b67d1 # v0.2.1
        with:
          github_app_id: ${{ secrets.APP_ID }}
          github_app_private_key: ${{ secrets.APP_PRIVATE_KEY }}
          github_app_permissions: >-
            {"contents": "write"}
          github_app_repositories: >-
            ["${{github.event.repository.name}}"]
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          # FIX -> the branch to push onto; CHECK -> default merge/dispatch ref.
          # yamllint disable-line rule:line-length
          ref: ${{ steps.mode.outputs.fix == 'true' && steps.mode.outputs.ref || github.ref }}
          token: ${{ steps.app_token.outputs.token || github.token }}
      - name: setup just
        # yamllint disable-line rule:line-length
        uses: extractions/setup-just@e33e0265a09d6d736e2ee1e0eb685ef1de4669ff # v3
      - name: setup uv
        uses: astral-sh/setup-uv@f0ec1fc3b38f5e7cd731bb6ce540c5af426746bb # v6
        with:
          python-version: "3.11"
          activate-environment: true
          enable-cache: true
      - name: setup rust
        # yamllint disable-line rule:line-length
        uses: actions-rust-lang/setup-rust-toolchain@fb51252c7ba57d633bc668f941da052e410add48 # v1
        with:
          toolchain: stable
          cache: true
          cache-shared-key: shared-rust-cache
      - name: build fenic (sync + rust extension)
        run: just setup
      - name: regenerate reference
        # yamllint disable-line rule:line-length
        run: uv run --project . python .claude/skills/fenic-mechanics/scripts/generate_reference.py
      - name: check or fix reference
        env:
          fix_mode: ${{ steps.mode.outputs.fix }}
          fix_ref: ${{ steps.mode.outputs.ref }}
          # Auth for the createCommitOnBranch API call (FIX mode only).
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          ref_dir=.claude/skills/fenic-mechanics/reference
          # Stage with -A so a newly added reference file is detected too, not
          # only edits to tracked files.
          git add -A -- "$ref_dir"
          if git diff --cached --quiet -- "$ref_dir"; then
            echo "fenic-mechanics reference is up to date"
            exit 0
          fi
          if [ "$fix_mode" = "true" ]; then
            # Create the reference commit through the GitHub API
            # (createCommitOnBranch), NOT a runner `git commit`: API commits are
            # GitHub-signed/verified, which `main`'s required-signatures rule
            # demands. A runner git commit is unsigned and would block the release.
            version="$(cat "$ref_dir/VERSION")"
            expected_oid="$(git rev-parse HEAD)"
            additions="$(git diff --cached --name-only --diff-filter=ACMR -- "$ref_dir" \
              | while IFS= read -r p; do
                  jq -n --arg path "$p" --arg contents "$(base64 -w0 <"$p")" '{path:$path, contents:$contents}'
                done | jq -s '.')"
            deletions="$(git diff --cached --name-only --diff-filter=D -- "$ref_dir" \
              | while IFS= read -r p; do jq -n --arg path "$p" '{path:$path}'; done | jq -s '.')"
            payload="$(jq -n \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "$fix_ref" \
              --arg oid "$expected_oid" \
              --arg message "chore: regenerate fenic-mechanics reference for fenic v${version}" \
              --argjson additions "$additions" \
              --argjson deletions "$deletions" \
              '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
                variables: {input: {
                  branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                  expectedHeadOid: $oid,
                  message: {headline: $message},
                  fileChanges: {additions: $additions, deletions: $deletions}}}}')"
            # Best-effort: if release-please rewrote the branch since checkout, the
            # expectedHeadOid no longer matches and the mutation errors -- warn and
            # exit 0. FIX re-runs on the next branch update; feature-PR CHECK mode
            # remains the hard gate.
            if printf '%s' "$payload" | gh api graphql --input - >/dev/null; then
              echo "Created a signed fenic-mechanics reference commit on ${fix_ref}."
            else
              echo "::warning::Could not create the reference commit on ${fix_ref} (likely a head-oid race with release-please). It will retry on the next branch update; feature-PR CHECK mode remains the hard gate."
            fi
          else
            echo "::error::fenic-mechanics reference is out of date. Regenerate it with: just generate-reference (then commit the reference changes)."
            git --no-pager diff --cached -- "$ref_dir"
            exit 1
          fi
