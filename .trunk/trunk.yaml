---
# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.25.11
    - node@22.16.0
    - python@3.11.9!
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - gitleaks@8.30.1
    - trufflehog-git@3.96.0
    - actionlint@1.7.12
    - renovate@44.11.4
    - shellcheck@0.11.0
    - shfmt@3.13.1
    # Polars 0.54.4 uses a Rust 1.95 array-length inference feature.
    - rustfmt@1.95.0
    - clippy@1.95.0
    - ruff@0.16.1
    - taplo@0.10.0
    - checkov@3.3.9
    - git-diff-check
    - markdownlint@0.49.1
    - osv-scanner@2.4.0
    - prettier@3.9.6
    - trivy@0.73.0
    - trufflehog@3.96.0
    - yamllint@1.38.0
    - bandit@1.9.4
  definitions:
    - name: osv-scanner
      commands:
        - name: scan
          run: osv-scanner --lockfile=${target} --format json --config=.trunk/configs/osv-scanner.toml
    - name: block-manual-version
      description: Blocks manual version changes in Cargo.toml and pyproject.toml except release-please
      files: [toml]
      commands:
        - name: check-block-manual-version
          run: ".trunk/scripts/check-block-manual-version.sh ${target}"
          success_codes: [0]
          read_output_from: stdout
          parser:
            run: 'sed -E "s/([^:]*):([0-9]+):(.*)/\1:\2:0: [error] manual version change detected - versions should be handled by release-please (version-field)/"'
          output: regex
          parse_regex: "(?P<path>.*):(?P<line>-?\\d+):(?P<col>-?\\d+): \\[(?P<severity>[^\\]]*)\\] (?P<message>[^\\(]*) \\((?P<code>[^\\)]*)\\)"
  ignore:
    # Allow assert statements in tests.
    - linters: [bandit]
      paths:
        - tests
    - linters: [bandit, ruff]
      paths:
        - src/fenic/_gen/protos/**
    - linters: [markdownlint, prettier]
      paths:
        - CHANGELOG.md # let release-please be release-please
        - examples/markdown_processing/attention_is_all_you_need.md
        - examples/**/README.md
        - .kiro/**
        - .claude/agents/*
        - .claude/AGENT_DEVELOPMENT_GUIDE.md
        # Generated by generate_reference.py; formatters would rewrite it and
        # break the fenic_mechanics_reference drift-check. Do not edit by hand.
        - .claude/skills/fenic-mechanics/reference/**
actions:
  disabled:
    - trunk-upgrade-available
  enabled:
    - trufflehog-pre-commit
    - buf-gen
    - gitleaks-pre-commit
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  definitions:
    - id: gitleaks-pre-commit
      run: .trunk/tools/gitleaks git --staged --no-banner -v --exit-code 1
      triggers:
        - git_hooks: [pre-commit]
