syntax = "proto3";

package logical_plan.v1;

import "logical_plan/v1/datatypes.proto";
import "logical_plan/v1/enums.proto";
import "logical_plan/v1/complex_types.proto";

// Base message for all logical expressions
message LogicalExpr {
  oneof expr_type {
    // Basic expressions
    ColumnExpr column = 1;
    LiteralExpr literal = 2;
    AliasExpr alias = 3;
    SortExpr sort = 4;
    IndexExpr index = 5;
    ArrayExpr array = 6;
    StructExpr struct = 7;
    CastExpr cast = 8;
    NotExpr not = 9;
    CoalesceExpr coalesce = 10;
    InExpr in = 11;
    IsNullExpr is_null = 12;
    ArrayLengthExpr array_length = 13;
    ArrayContainsExpr array_contains = 14;

    // Binary expressions - using same proto for different operator types
    BinaryExpr arithmetic = 20;
    BinaryExpr boolan = 21;
    BinaryExpr equality_comparison = 22;
    BinaryExpr numeric_comparison = 23;
    
    // Semantic expressions
    SemanticMapExpr semantic_map = 30;
    SemanticExtractExpr semantic_extract = 31;
    SemanticPredExpr semantic_pred = 32;
    SemanticReduceExpr semantic_reduce = 33;
    SemanticClassifyExpr semantic_classify = 34;
    AnalyzeSentimentExpr analyze_sentiment = 35;
    EmbeddingsExpr embeddings = 36;
    SemanticSummarizeExpr semantic_summarize = 37;

    // Embedding expressions
    EmbeddingNormalizeExpr embedding_normalize = 40;
    EmbeddingSimilarityExpr embedding_similarity = 41;
    
    // Text expressions
    TextractExpr textract = 50;
    TextChunkExpr text_chunk = 51;
    RecursiveTextChunkExpr recursive_text_chunk = 52;
    CountTokensExpr count_tokens = 53;
    ConcatExpr concat = 54;
    ArrayJoinExpr array_join = 55;
    ContainsExpr contains = 56;
    ContainsAnyExpr contains_any = 57;
    RLikeExpr rlike = 58;
    LikeExpr like = 59;
    ILikeExpr ilike = 60;
    TsParseExpr ts_parse = 61;
    StartsWithExpr starts_with = 62;
    EndsWithExpr ends_with = 63;
    RegexpSplitExpr regexp_split = 64;
    SplitPartExpr split_part = 65;
    StringCasingExpr string_casing = 66;
    StripCharsExpr strip_chars = 67;
    ReplaceExpr replace = 68;
    StrLengthExpr str_length = 69;
    
    // JSON expressions
    JqExpr jq = 70;
    JsonTypeExpr json_type = 71;
    JsonContainsExpr json_contains = 72;
    
    // Markdown expressions
    MdToJsonExpr md_to_json = 80;
    MdGetCodeBlocksExpr md_get_code_blocks = 81;
    MdGenerateTocExpr md_generate_toc = 82;
    MdExtractHeaderChunks md_extract_header_chunks = 83;
    
    // Case expressions
    WhenExpr when = 90;
    OtherwiseExpr otherwise = 91;

  }
}

// Basic expressions - using descriptive  suffix naming
message ColumnExpr {
  string name = 1;
}

message LiteralExpr {
  oneof value_type {
    string string_value = 1;
    int64 int_value = 2;
    double double_value = 3;
    bool bool_value = 4;
    bytes bytes_value = 5;
    //all types we support for LiteralExpr
  }
  DataType data_type = 20;
}

message AliasExpr {
  LogicalExpr expr = 1;
  string name = 2;
}

message SortExpr {
  LogicalExpr expr = 1;
  string order = 2;  // "asc" or "desc"
}

message IndexExpr {
  LogicalExpr expr = 1;
  oneof index_type {
    int32 int_index = 2;
    string string_index = 3;
    LogicalExpr expr_index = 4;
  }
}

message ArrayExpr {
  repeated LogicalExpr exprs = 1;
}

message StructExpr {
  repeated LogicalExpr exprs = 1;
  repeated string field_names = 2;
}

message CastExpr {
  LogicalExpr expr = 1;
  DataType dest_type = 2;
}

message NotExpr {
  LogicalExpr expr = 1;
}

message CoalesceExpr {
  repeated LogicalExpr exprs = 1;
}

message InExpr {
  LogicalExpr expr = 1;
  LogicalExpr other = 2;
}

message IsNullExpr {
  LogicalExpr expr = 1;
}

message ArrayLengthExpr {
  LogicalExpr expr = 1;
}

message ArrayContainsExpr {
  LogicalExpr expr = 1;
  LogicalExpr value = 2;
}

// Binary expressions - single proto for all binary operators
message BinaryExpr {
  LogicalExpr left = 1;
  LogicalExpr right = 2;
  Operator operator = 3;
}

// Semantic expressions - using descriptive  suffix naming
message SemanticMapExpr {
  string instruction = 1;
  repeated LogicalExpr exprs = 2;  // Parsed from instruction
  int32 max_tokens = 3;
  float temperature = 4;
  optional string model_alias = 5;
  optional PydanticModelType response_format = 6;
  optional MapExampleCollection examples = 7;
}

message SemanticExtractExpr {
  LogicalExpr expr = 1;
  PydanticModelType schema = 2;  // Required schema for extraction
  float temperature = 3;
  optional string model_alias = 4;
}

message SemanticPredExpr {
  LogicalExpr expr = 1;
  string predicate = 2;
  float temperature = 3;
  optional string model_alias = 4;
  optional PredicateExampleCollection examples = 5;
}

message SemanticReduceExpr {
  LogicalExpr expr = 1;
  string instruction = 2;
  int32 max_tokens = 3;
  float temperature = 4;
  optional string model_alias = 5;
}

message SemanticClassifyExpr {
  LogicalExpr expr = 1;
  repeated string labels = 2;  // Simple string list for classification labels
  float temperature = 3;
  optional string model_alias = 4;
  optional ClassifyExampleCollection examples = 5;
}

message AnalyzeSentimentExpr {
  LogicalExpr expr = 1;
  float temperature = 2;
  optional string model_alias = 3;
}

message EmbeddingsExpr {
  repeated LogicalExpr exprs = 1;
  optional string model_alias = 2;
}

message SemanticSummarizeExpr {
  LogicalExpr expr = 1;
  SummarizationFormat format = 2;
  float temperature = 3;
  optional string model_alias = 4;
}

// Embedding expressions
message EmbeddingNormalizeExpr {
  LogicalExpr expr = 1;
}

message EmbeddingSimilarityExpr {
  LogicalExpr expr = 1;
  oneof other_type {
    LogicalExpr other_expr = 2;
    NumpyArray query_vector = 3;
  }
  SemanticSimilarityMetric metric = 4;
}

// Text expressions
message TextractExpr {
  repeated LogicalExpr exprs = 1;
  repeated string patterns = 2;
}

message TextChunkExpr {
  LogicalExpr expr = 1;
  int32 chunk_size = 2;
  int32 overlap = 3;
  ChunkLengthFunction length_function = 4;
  ChunkCharacterSet character_set = 5;
}

message RecursiveTextChunkExpr {
  LogicalExpr expr = 1;
  int32 chunk_size = 2;
  int32 overlap = 3;
  ChunkLengthFunction length_function = 4;
  ChunkCharacterSet character_set = 5;
}

message CountTokensExpr {
  LogicalExpr input_expr = 1;
  optional string model_alias = 2;
}

message ConcatExpr {
  repeated LogicalExpr exprs = 1;
  string separator = 2;
}

message ArrayJoinExpr {
  LogicalExpr expr = 1;
  string separator = 2;
}

message ContainsExpr {
  LogicalExpr expr = 1;
  string substring = 2;
  bool case_sensitive = 3;
}

message ContainsAnyExpr {
  LogicalExpr expr = 1;
  repeated string substrings = 2;
  bool case_sensitive = 3;
}

message RLikeExpr {
  LogicalExpr expr = 1;
  string pattern = 2;
  bool case_sensitive = 3;
}

message LikeExpr {
  LogicalExpr expr = 1;
  string pattern = 2;
  bool case_sensitive = 3;
}

message ILikeExpr {
  LogicalExpr expr = 1;
  string pattern = 2;
}

message TsParseExpr {
  LogicalExpr expr = 1;
  string format = 2;
}

message StartsWithExpr {
  LogicalExpr expr = 1;
  string prefix = 2;
  bool case_sensitive = 3;
}

message EndsWithExpr {
  LogicalExpr expr = 1;
  string suffix = 2;
  bool case_sensitive = 3;
}

message RegexpSplitExpr {
  LogicalExpr expr = 1;
  string pattern = 2;
  int32 limit = 3;
}

message SplitPartExpr {
  LogicalExpr expr = 1;
  string delimiter = 2;
  int32 index = 3;
}

message StringCasingExpr {
  LogicalExpr expr = 1;
  string case_type = 2;  // "upper", "lower", "title", etc.
}

message StripCharsExpr {
  LogicalExpr expr = 1;
  string chars = 2;
  string side = 3;  // "left", "right", "both"
}

message ReplaceExpr {
  LogicalExpr expr = 1;
  string old_value = 2;
  string new_value = 3;
  bool global = 4;
}

message StrLengthExpr {
  LogicalExpr expr = 1;
}

// JSON expressions
message JqExpr {
  LogicalExpr expr = 1;
  string query = 2;
}

message JsonTypeExpr {
  LogicalExpr expr = 1;
}

message JsonContainsExpr {
  LogicalExpr expr = 1;
  string key = 2;
}

// Markdown expressions
message MdToJsonExpr {
  LogicalExpr expr = 1;
}

message MdGetCodeBlocksExpr {
  LogicalExpr expr = 1;
  optional string language = 2;
  bool include_text = 3;
}

message MdGenerateTocExpr {
  LogicalExpr expr = 1;
  int32 max_depth = 2;
  bool include_links = 3;
}

message MdExtractHeaderChunks {
  LogicalExpr expr = 1;
  int32 max_chunk_size = 2;
  int32 overlap = 3;
}

// Case expressions
message WhenExpr {
  optional LogicalExpr expr = 1;  // Optional for simple CASE
  LogicalExpr condition = 2;
  LogicalExpr value = 3;
}

message OtherwiseExpr {
  LogicalExpr expr = 1;
  LogicalExpr value = 2;
}
