syntax = "proto3";

package logical_plan.v1;

// NumPy array serialization
message NumpyArray {
  bytes data = 1;
  repeated int32 shape = 2;
  string dtype = 3;
}

// Pydantic model type serialization (for response_format)
message PydanticModelType {
  string json_schema = 1;
}

// Pydantic model instances - direct protobuf messages for each type

// KeyPoints format for summarization
message KeyPointsProto {
  int32 max_points = 1;
}

// Paragraph format for summarization
message ParagraphProto {
  int32 max_words = 1;
}

// Union type for summarization formats
// TODO(brandon): figure out how to handle this.
message SummarizationFormatProto {
  oneof format_type {
    KeyPointsProto key_points = 1;
    ParagraphProto paragraph = 2;
  }
}

// Semantic example types
// TODO(brandon): figure out how this is going to work with structured format map examples
message MapExampleProto {
  map<string, string> input = 1;
  string output = 2;
}

message MapExampleCollectionProto {
  repeated MapExampleProto examples = 1;
}

message ClassifyExampleProto {
  string input = 1;
  string output = 2;
}

message ClassifyExampleCollectionProto {
  repeated ClassifyExampleProto examples = 1;
}

message PredicateExampleProto {
  map<string, string> input = 1;
  bool output = 2;
}

message PredicateExampleCollectionProto {
  repeated PredicateExampleProto examples = 1;
}

message JoinExampleProto {
  string left = 1;
  string right = 2;
  bool output = 3;
}

message JoinExampleCollectionProto {
  repeated JoinExampleProto examples = 1;
}
