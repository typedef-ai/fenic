syntax = "proto3";

package logical_plan.v1;

import "logical_plan/v1/datatypes.proto";
import "logical_plan/v1/enums.proto";
import "logical_plan/v1/expressions.proto";
import "logical_plan/v1/complex_types.proto";

// Base message for all logical plans
message LogicalPlan {
  oneof plan_type {
    // Source operations
    InMemorySource in_memory_source = 1;
    FileSource file_source = 2;
    TableSource table_source = 3;
    
    // Transform operations
    Projection projection = 10;
    Filter filter = 11;
    Join join = 12;
    Aggregate aggregate = 13;
    Union union = 14;
    Limit limit = 15;
    Explode explode = 16;
    DropDuplicates drop_duplicates = 17;
    Sort sort = 18;
    Unnest unnest = 19;
    SQL sql = 20;
    SemanticCluster semantic_cluster = 21;
    SemanticJoin semantic_join = 22;
    SemanticSimilarityJoin semantic_similarity_join = 23;
    
    // Sink operations
    FileSink file_sink = 30;
    TableSink table_sink = 31;
  }
}

// Supporting types
message FenicSchema {
  repeated ColumnField column_fields = 1;
}

message ColumnField {
  string name = 1;
  DataType data_type = 2;
}

message InMemorySource {
  bytes source = 1;
  optional FenicSchema schema = 2;
}

message FileSource {
  repeated string paths = 1;
  string file_format = 2;
  FenicSchema schema = 3;
}

message TableSource {
  string table_name = 1;
  FenicSchema schema = 2;
}

// Transform operations
message Projection {
  LogicalPlan input = 1;
  repeated LogicalExpr exprs = 2;
  FenicSchema schema = 3;
}

message Filter {
  LogicalPlan input = 1;
  LogicalExpr predicate = 2;
  FenicSchema schema = 3;
}

message Join {
  LogicalPlan left = 1;
  LogicalPlan right = 2;
  string join_type = 3;
  repeated LogicalExpr left_on = 4;
  repeated LogicalExpr right_on = 5;
  FenicSchema schema = 6;
}

message SemanticJoin {
  LogicalPlan left = 1;
  LogicalPlan right = 2;
  LogicalExpr left_on = 3;
  LogicalExpr right_on = 4;
  string jinja_template = 5;
  bool strict = 6;
  float temperature = 7;
  optional ResolvedModelAlias model_alias = 8;
  optional JoinExampleCollection examples = 9;
  FenicSchema schema = 10;
}

message SemanticSimilarityJoin {
  // Python `Literal` Enums
  enum SemanticSimilarityMetric {
    COSINE = 0;
    L2 = 1;
    DOT = 2;
  }
  LogicalPlan left = 1;
  LogicalPlan right = 2;
  LogicalExpr left_on = 3;
  LogicalExpr right_on = 4;
  int32 k = 6;
  SemanticSimilarityMetric similarity_metric = 7;
  optional string similarity_score_column = 8;
  FenicSchema schema = 9;
}

message Aggregate {
  LogicalPlan input = 1;
  repeated LogicalExpr group_exprs = 2;
  repeated LogicalExpr agg_exprs = 3;
  FenicSchema schema = 4;
}

message Union {
  repeated LogicalPlan inputs = 1;
  FenicSchema schema = 2;
}

message Limit {
  LogicalPlan input = 1;
  int32 n = 2;
  FenicSchema schema = 3;
}

message Explode {
  LogicalPlan input = 1;
  LogicalExpr expr = 2;
  FenicSchema schema = 3;
}

message DropDuplicates {
  LogicalPlan input = 1;
  repeated LogicalExpr subset = 2;
  FenicSchema schema = 3;
}

message Sort {
  LogicalPlan input = 1;
  repeated LogicalExpr sort_exprs = 2;
  FenicSchema schema = 3;
}

message Unnest {
  LogicalPlan input = 1;
  repeated LogicalExpr exprs = 2;
  FenicSchema schema = 3;
}

message SQL {
  repeated LogicalPlan inputs = 1;
  repeated string template_names = 2;
  string templated_query = 3;
  FenicSchema schema = 4;
}

message SemanticCluster {
  LogicalPlan input = 1;
  LogicalExpr by_expr = 2;
  int32 num_clusters = 3;
  int32 max_iter = 4;
  int32 num_init = 5;
  string label_column = 6;
  optional string centroid_column = 7;
  FenicSchema schema = 8;
}

message FileSink {
  LogicalPlan child = 1;
  string sink_type = 2;
  string path = 3;
  string mode = 4;
  FenicSchema schema = 6;
}

message TableSink {
  LogicalPlan child = 1;
  string table_name = 2;
  string mode = 3;
  FenicSchema schema = 4;
}