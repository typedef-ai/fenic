syntax = "proto3";

package logical_plan.v1;

import "logical_plan/v1/datatypes.proto";
import "logical_plan/v1/enums.proto";
import "logical_plan/v1/expressions.proto";

// Base message for all logical plans
message LogicalPlan {
  oneof plan_type {
    // Source operations
    InMemorySource in_memory_source = 1;
    FileSource file_source = 2;
    TableSource table_source = 3;
    
    // Transform operations
    Projection projection = 10;
    Filter filter = 11;
    Join join = 12;
    Aggregate aggregate = 13;
    Union union = 14;
    Limit limit = 15;
    Explode explode = 16;
    DropDuplicates drop_duplicates = 17;
    Sort sort = 18;
    Unnest unnest = 19;
    SQL sql = 20;
    SemanticCluster semantic_cluster = 21;
    
    // Sink operations
    FileSink file_sink = 30;
    TableSink table_sink = 31;
  }
}

// Supporting types
message Schema {
  repeated ColumnField fields = 1;
}

message ColumnField {
  string name = 1;
  DataType data_type = 2;
}

message InMemorySource {
  bytes dataframe_data = 1;  // Serialized polars DataFrame (will require custom serde)
  Schema schema = 2;
}

message FileSource {
  repeated string paths = 1;
  string format = 2;
  Schema schema = 3;
  repeated string columns = 4;
}

message TableSource {
  string table_name = 1;
}

// Transform operations
message Projection {
  LogicalPlan input = 1;
  repeated LogicalExpr expressions = 2;
}

message Filter {
  LogicalPlan input = 1;
  LogicalExpr predicate = 2;
}

message Join {
  LogicalPlan left = 1;
  LogicalPlan right = 2;
  string join_type = 3;
  repeated LogicalExpr left_keys = 4;
  repeated LogicalExpr right_keys = 5;
  optional LogicalExpr filter = 6;
}

message Aggregate {
  LogicalPlan input = 1;
  repeated LogicalExpr group_exprs = 2;
  repeated LogicalExpr agg_exprs = 3;
}

message Union {
  repeated LogicalPlan inputs = 1;
}

message Limit {
  LogicalPlan input = 1;
  int32 n = 2;
}

message Explode {
  LogicalPlan input = 1;
  LogicalExpr expr = 2;
}

message DropDuplicates {
  LogicalPlan input = 1;
  repeated LogicalExpr exprs = 2;
}

message Sort {
  LogicalPlan input = 1;
  repeated LogicalExpr exprs = 2;
}

message Unnest {
  LogicalPlan input = 1;
  repeated LogicalExpr exprs = 2;
}

message SQL {
  repeated LogicalPlan inputs = 1;
  repeated string template_names = 2;
  string templated_query = 3;
}

message SemanticCluster {
  LogicalPlan input = 1;
  LogicalExpr expr = 2;
  int32 n_clusters = 3;
  optional string model_alias = 4;
}

message FileSink {
  LogicalPlan input = 1;
  string path = 2;
  string format = 3;
  string mode = 4;
}

message TableSink {
  LogicalPlan input = 1;
  string table_name = 2;
  string mode = 3;
}