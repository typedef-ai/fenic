syntax = "proto3";

package logical_plan.v1;

import "logical_plan/v1/datatypes.proto";
import "logical_plan/v1/enums.proto";
import "logical_plan/v1/expressions.proto";

// Base message for all logical plans
message LogicalPlanProto {
  oneof plan_type {
    // Source operations
    InMemorySourceProto in_memory_source = 1;
    FileSourceProto file_source = 2;
    TableSourceProto table_source = 3;
    
    // Transform operations
    ProjectionProto projection = 10;
    FilterProto filter = 11;
    JoinProto join = 12;
    AggregateProto aggregate = 13;
    UnionProto union = 14;
    LimitProto limit = 15;
    ExplodeProto explode = 16;
    DropDuplicatesProto drop_duplicates = 17;
    SortProto sort = 18;
    UnnestProto unnest = 19;
    SQLProto sql = 20;
    SemanticClusterProto semantic_cluster = 21;
    
    // Sink operations
    FileSinkProto file_sink = 30;
    TableSinkProto table_sink = 31;
  }
}

// Supporting types
message SchemaProto {
  repeated ColumnFieldProto fields = 1;
}

message ColumnFieldProto {
  string name = 1;
  DataTypeProto data_type = 2;
}

message InMemorySourceProto {
  bytes dataframe_data = 1;  // Serialized polars DataFrame (will require custom serde)
  SchemaProto schema = 2;
}

message FileSourceProto {
  repeated string paths = 1;
  string format = 2;
  SchemaProto schema = 3;
  repeated string columns = 4;
}

message TableSourceProto {
  string table_name = 1;
}

// Transform operations
message ProjectionProto {
  LogicalPlanProto input = 1;
  repeated LogicalExprProto expressions = 2;
}

message FilterProto {
  LogicalPlanProto input = 1;
  LogicalExprProto predicate = 2;
}

message JoinProto {
  LogicalPlanProto left = 1;
  LogicalPlanProto right = 2;
  string join_type = 3;
  repeated LogicalExprProto left_keys = 4;
  repeated LogicalExprProto right_keys = 5;
  optional LogicalExprProto filter = 6;
}

message AggregateProto {
  LogicalPlanProto input = 1;
  repeated LogicalExprProto group_exprs = 2;
  repeated LogicalExprProto agg_exprs = 3;
}

message UnionProto {
  repeated LogicalPlanProto inputs = 1;
}

message LimitProto {
  LogicalPlanProto input = 1;
  int32 n = 2;
}

message ExplodeProto {
  LogicalPlanProto input = 1;
  LogicalExprProto expr = 2;
}

message DropDuplicatesProto {
  LogicalPlanProto input = 1;
  repeated LogicalExprProto exprs = 2;
}

message SortProto {
  LogicalPlanProto input = 1;
  repeated LogicalExprProto exprs = 2;
}

message UnnestProto {
  LogicalPlanProto input = 1;
  repeated LogicalExprProto exprs = 2;
}

message SQLProto {
  repeated LogicalPlanProto inputs = 1;
  repeated string template_names = 2;
  string templated_query = 3;
}

message SemanticClusterProto {
  LogicalPlanProto input = 1;
  LogicalExprProto expr = 2;
  int32 n_clusters = 3;
  optional string model_alias = 4;
}

message FileSinkProto {
  LogicalPlanProto input = 1;
  string path = 2;
  string format = 3;
  string mode = 4;
}

message TableSinkProto {
  LogicalPlanProto input = 1;
  string table_name = 2;
  string mode = 3;
}